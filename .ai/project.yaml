# Generado por /init. Lo leen todas las skills del flujo.
name: Dentissa
type: fullstack                # frontend | backend | fullstack | mobile | monorepo | library
stage: prototype               # prototype | mvp | production | maintenance
origin: brownfield             # greenfield | brownfield
language: es                   # es | en | … idioma de los documentos (shared/vocabulary.md)
initialized_at: 2026-09-22
stack:
  languages: [php, javascript]
  frontend: "Blade + JS vanilla por página (fetch), Tailwind CSS 4, Vite 7"
  backend: "Laravel 12 (PHP 8.4), Sanctum 4, monolito modular hexagonal en app/Modules"
  database: "PostgreSQL 16 (Eloquent); Redis 7 (tokens de reset)"
  package_manager: "composer + npm"
packages: []
constitution_version: 1.2.0
workflow:
  enforcement: warn            # off | warn (pide aprobación) | block — lo aplica el hook del plugin
  # Flujo AI-DLC previo en pausa: reglas en AIDLC.md, estado en aidlc-docs/aidlc-state.md
  # (Unidad 5 ContentManagement a medias; Unidades 6 Email y 7 whatsApp pendientes).
  legacy_workflow: aidlc-paused
  lanes:                       # carriles /fix, /refactor, /chore (shared/contract.md → "Carriles")
    max_files: 5               # más archivos de código (sin tests ni docs) → flujo completo
    contract_paths: []         # rutas que son contrato público además de openapi/proto/graphql
sync:
  last: null                   # commit hasta el que /sync concilió la deriva
skills_version: 1.14.0  # versión del paquete de skills (actualizado con /init --upgrade el 2026-10-15; inicializado con 1.8.1)
deploy:
  strategy: manual             # none | manual | ci-on-merge | ci-on-tag
  platform: "Droplet de DigitalOcean con Docker Compose, detrás de Cloudflare (dentissapp.com)"
  environments: [local, prod]
  prod_approval: human         # innegociable
  rollback: "docker/prod/rollback.sh (versión anterior, con --restore <dump> o --to-manual); ensayado en el droplet (docs/deployment.md)"
security:
  owasp_top10_edition: 2025
  asvs_level: 2
  masvs_level: null            # solo mobile
  sensitive_data: [personal, health, credentials]
  compliance: [LFPDPPP]        # México; datos de salud = datos personales sensibles
  tools:                       # status: propuesta | instalada | en-ci | no-aplica. Solo se ejecutan
                               # instalada y en-ci; una propuesta es un pendiente, no un control;
                               # no-aplica lleva su motivo en docs/security.md.
    # gitleaks, semgrep y trivy no están instalados en el equipo: se ejecutan con sus imágenes
    # de Docker desde la raíz del repositorio (decisión del usuario, 2026-10-04). En Git Bash de
    # Windows, anteponer MSYS_NO_PATHCONV=1. Desde el 2026-10-05 también corren en CI
    # (.github/workflows/ai-dd.yml), con las imágenes fijadas a una versión.
    secrets: { command: 'docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-banner --source /repo', status: en-ci }
    sast: { command: 'docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest semgrep scan --config p/php --metrics=off --error app config bootstrap routes', status: en-ci }
    sca: { command: "docker compose exec -T app composer audit && docker compose exec -T app npm audit --audit-level=high", status: en-ci }
    containers: { command: 'docker run --rm -v "$PWD:/repo" aquasec/trivy:latest config --severity HIGH,CRITICAL /repo/docker', status: en-ci }
    dast: { command: null, status: no-aplica }   # solo contra staging; no hay staging
  agent:
    min_package_age_days: 7
    protected_paths:
      - AIDLC.md
      - .aidlc-rule-details/
      - aidlc-docs/
      - docker-compose.yml
      - docker/
      - phpunit.xml
observability:
  log_level_prod: info         # roadmap objetivo 5
  correlation_header: X-Request-Id   # propuesto; el objetivo 5 pide un identificador por petición en logs y respuesta
  audit:
    required: true             # LFPDPPP: datos de salud = datos personales sensibles
    events: [login, login_failed, access_denied, sensitive_read, sensitive_write, role_change]
    retention: "5 años (como el expediente clínico); base legal por confirmar"
seo:                           # solo sitios web públicos (shared/contract.md → "SEO técnico")
  status: inferred             # /seo audit sobre producción, 2026-10-15 (el usuario quiere que el sitio aparezca en buscadores)
  indexable: true              # decisión del usuario, 2026-10-15
  site_url: https://dentissapp.com
  rendering: ssr               # Blade en el servidor; la galería pública carga sus imágenes con JS (SE5)
skills:
  enabled: [design]
design:                        # solo proyectos con interfaz (frontend, fullstack, mobile)
  status: approved             # sistema 2.0.0 (variante B de la spec 016), aprobado por el usuario el 2026-10-08
  source: chosen               # chosen: elegido entre opciones · extracted: documentado del código
  system: docs/design/system.md
  html: docs/design/system.html
  canvas: null
  widths: [390, 768, 1440]     # anchos de comprobación
paths:
  constitution: docs/constitution.md
  architecture: docs/architecture.md
  roadmap: docs/roadmap.md
  deployment: docs/deployment.md
  security: docs/security.md
  observability: docs/observability.md
  seo: docs/seo.md             # solo si seo.indexable es true
  changes: docs/changes
  changelog: CHANGELOG.md
  specs: docs/specs
  adr: docs/adr
  templates: docs/templates
template_hashes:              # huellas de docs/templates/ al copiarlas (aidd.py templates --yaml)
  adr.md: 479eaebd1fed
  change.md: 776fe7c0b58d
  plan.md: 2a5c45f54da9
  review.md: b307b807a00f
  spec.md: 876efac8d9eb
  tasks.md: 77ed236f954b
verification:                  # lo llena la Fase 4 (2026-09-22)
  - { command: "python .ai/bin/aidd.py validate", result: pass, note: "13 specs, 0 errores; re-sincronizado a 1.4.1 el 2026-09-24 (ya no requiere PYTHONIOENCODING)" }
  - { command: "vendor/bin/pint --dirty --test", result: pass, note: "ejecutado en el host (PHP 8.5); /init no tocó archivos PHP" }
  - { command: "npm run build", result: pass, note: "ejecutado en el host (Node 22)" }
  - { command: "./vendor/bin/pest --parallel", result: not_run, note: "Docker Desktop apagado; los tests necesitan PostgreSQL en el host db. Último resultado documentado: 495/495 (AI-DLC U4, 2026-09-13)" }
