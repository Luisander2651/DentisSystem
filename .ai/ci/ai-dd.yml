# Generado por /init (ai-dd). Valida el flujo y la seguridad en cada PR.
# INACTIVO: guardado aquí a propósito (GitHub solo ejecuta .github/workflows/).
# Para activarlo, cuando el código pase gitleaks, semgrep, composer/npm audit y trivy:
#   git mv .ai/ci/ai-dd.yml .github/workflows/ai-dd.yml
# Los tests de Pest corren en tests.yml; este workflow no los duplica.
# Fija cada acción a un SHA de commit completo en lugar de una etiqueta (cadena de suministro).
name: ai-dd

on:
  pull_request:

permissions:
  contents: read

jobs:
  flujo:
    name: Artefactos del flujo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # TODO: fijar a SHA
      - uses: actions/setup-python@v5   # TODO: fijar a SHA
        with:
          python-version: "3.12"
      - name: Validar specs, planes y tareas
        run: python .ai/bin/aidd.py validate

  calidad:
    name: Formato (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # TODO: fijar a SHA
      - uses: shivammathur/setup-php@v2   # TODO: fijar a SHA
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      # Solo archivos cambiados en el PR: el código previo no cumple Pint (deuda en docs/roadmap.md).
      - name: Pint sobre los archivos PHP del PR
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}"...HEAD -- '*.php' || true)
          if [ -n "$FILES" ]; then vendor/bin/pint --test $FILES; else echo "Sin archivos PHP cambiados"; fi

  seguridad:
    name: Seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # TODO: fijar a SHA
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2   # TODO: fijar a SHA
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4   # TODO: fijar a SHA
        with:
          node-version: '20'
      - name: Secretos (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner   # TODO: fijar versión de imagen
      - name: SAST (semgrep)
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --config p/php --error   # TODO: fijar versión de imagen
      - name: Dependencias (SCA)
        run: |
          composer audit --locked
          npm audit --audit-level=high
      - name: Contenedores / IaC (trivy)
        run: docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest config --severity HIGH,CRITICAL --exit-code 1 docker/ docker-compose.yml   # TODO: fijar versión de imagen
