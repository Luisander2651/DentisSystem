name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: example
          POSTGRES_DB: dentissa_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis, mbstring, bcmath, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: dentissa_testing
          DB_USERNAME: admin
          DB_PASSWORD: example
        run: php artisan migrate --env=testing --force

      - name: Run tests (Pest, parallel)
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: dentissa_testing
          DB_USERNAME: admin
          DB_PASSWORD: example
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array
        run: ./vendor/bin/pest --parallel

      # Spec 016 (A67): the browser checks run here without blocking while the screens are
      # being migrated; T075 makes the step decide the build and keeps the captures.
      - name: Run browser checks (ui-audit, not blocking yet)
        continue-on-error: true
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: dentissa_testing
          DB_USERNAME: admin
          DB_PASSWORD: example
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          SESSION_DRIVER: file
          MAIL_MAILER: array
          FILESYSTEM_DISK: public
          PHP_CLI_SERVER_WORKERS: 4
        run: |
          php artisan storage:link
          php artisan ui:audit-data
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/login && break; sleep 1; done
          set -o pipefail
          npm run test:ui -- --base-url http://127.0.0.1:8000 --artisan "php artisan" --screenshots | tee ui-audit.txt

      - name: Keep the ui-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: |
            ui-audit.txt
            tests/Browser/screenshots
          if-no-files-found: ignore
