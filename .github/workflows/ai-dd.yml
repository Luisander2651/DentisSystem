# Generado por /init (ai-dd). Valida el flujo y la seguridad en cada PR.
# Activo desde el 2026-10-05 (antes guardado sin activar en .ai/ci/; decisión del usuario).
# Los tests de Pest corren en tests.yml; este workflow no los duplica.
# Modo baseline: los pasos de seguridad solo fallan por problemas NUEVOS del PR, para que la deuda
# previa (registrada en docs/security.md) no bloquee todos los PRs. Un job semanal revisa el repo
# completo y reporta sin bloquear.
# Cada acción está fijada a un SHA de commit completo y cada imagen a una versión (cadena de
# suministro). semgrep corre con --metrics=off: no envía métricas a semgrep.dev (docs/security.md).
name: ai-dd

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # revisión completa semanal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flujo:
    name: Artefactos del flujo
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Validar specs, planes y tareas
        run: python .ai/bin/aidd.py validate

  calidad:
    name: Formato (Pint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240   # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      # Solo archivos cambiados en el PR: el código previo no cumple Pint (deuda en docs/roadmap.md).
      - name: Pint sobre los archivos PHP del PR
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}"...HEAD -- '*.php' || true)
          if [ -n "$FILES" ]; then vendor/bin/pint --test $FILES; else echo "Sin archivos PHP cambiados"; fi

  seguridad-pr:
    name: Seguridad (solo cambios del PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240   # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '22'
      - name: Secretos en los commits del PR (gitleaks)
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 git --log-opts="origin/${{ github.base_ref }}..HEAD" --no-banner /repo
      - name: SAST, solo hallazgos nuevos (semgrep)
        run: |
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0 semgrep scan --config p/php --metrics=off --baseline-commit "$BASE" --error app config bootstrap routes
      - name: Dependencias, solo si el PR cambia lockfiles (SCA)
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '(composer\.lock|package-lock\.json)$'; then
            composer audit --locked
            npm audit --audit-level=high
          else
            echo "El PR no cambia dependencias"
          fi
      - name: Contenedores / IaC, solo si el PR los cambia (trivy)
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(docker/|docker-compose\.yml$)'; then
            docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.74.0 config --severity HIGH,CRITICAL --exit-code 1 docker/ docker-compose.yml
          else
            echo "El PR no cambia docker/ ni docker-compose.yml"
          fi

  seguridad-completa:
    name: Seguridad (repo completo, informativo)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true   # reporta la deuda sin bloquear; cada hallazgo alto va a docs/security.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240   # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '22'
      - name: Secretos (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --no-banner
      - name: SAST (semgrep)
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0 semgrep scan --config p/php --metrics=off --error app config bootstrap routes
      - name: Dependencias (SCA)
        run: |
          composer audit --locked
          npm audit --audit-level=high
      - name: Contenedores / IaC (trivy)
        run: docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.74.0 config --severity HIGH,CRITICAL --exit-code 1 docker/ docker-compose.yml
