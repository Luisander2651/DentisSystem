server {
    listen 80;
    server_name dentissapp.com www.dentissapp.com;
    return 301 https://$host$request_uri;   # redirige todo a https
}

server {
    listen 443 ssl;
    server_name dentissapp.com www.dentissapp.com;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/dentissapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dentissapp.com/privkey.pem;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}