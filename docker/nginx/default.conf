server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html/public; # Apunta a la carpeta public de Laravel

    client_max_body_size 64M;

    # Local only: compress text as Cloudflare does in production, so Lighthouse measures the
    # public site with the transfer sizes visitors get (spec 026, T092).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000; # 'app' es el nombre del servicio en docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}