# Spec 028 (TM8): the access log records the path without the query, where a search carries
# the e-mail or name typed. $uri is not enough: try_files turns it into /index.php.
map $request_uri $path_without_query {
    "~^(?<path>[^?]*)" $path;
}

log_format without_query '$remote_addr [$time_iso8601] "$request_method $path_without_query $server_protocol" '
                         '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    access_log /var/log/nginx/access.log without_query;
    root /var/www/html/public; # Apunta a la carpeta public de Laravel

    client_max_body_size 64M;

    # Local only: compress text as Cloudflare does in production, so Lighthouse measures the
    # public site with the transfer sizes visitors get (spec 026, T092).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000; # 'app' es el nombre del servicio en docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}