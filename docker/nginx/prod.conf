# Production nginx for dentissapp.com (spec 015). Baked into the `web` image.
# Local development uses docker/nginx/default.conf instead.

# Real visitor IP behind Cloudflare (CA16). Only Cloudflare may set it: a client that
# connects straight to the droplet keeps its own address (CA17). Same ranges as
# config/security.php (trusted_proxies); CloudflareRangesTest keeps both lists equal.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server_tokens off;

server {
    listen 80;
    server_name dentissapp.com www.dentissapp.com;

    # Let's Encrypt renewal (webroot). Before the redirect, so certbot can answer.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dentissapp.com www.dentissapp.com;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/dentissapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dentissapp.com/privkey.pem;

    client_max_body_size 64M;

    # For everything nginx answers by itself (static files, uploads in /storage, errors).
    # PHP responses add their own through the SecurityHeaders middleware.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Cloudflare's "Always Use HTTPS" sends the ACME challenge here too.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Dotfiles (.env, .git, …) never exist for the outside world.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Compiled assets. A block that declares add_header loses the server-level ones, so
    # all three are repeated.
    location ^~ /build/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # The client IP is resolved once, here (real_ip above). PHP gets that IP instead of
        # the X-Forwarded-For the client sent, so Laravel's trusted proxies cannot be fed a
        # forged address by a visitor whose IP is inside Cloudflare's own ranges.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        # Same for the scheme: this server only answers PHP over TLS.
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        # Laravel sets these two as well; only the server-level ones are sent, once.
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
    }
}
