# Local development (spec 015). Production uses docker-compose.prod.yml in its own clone.
# Credentials come from your local .env; nothing here is a secret.
services:
  # Servicio de Aplicación (PHP + Composer + Node)
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      target: dev
    image: laravel-12-app
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # Shared with the queue so both see the same dependencies.
      - node_modules:/var/www/html/node_modules
      - vendor:/var/www/html/vendor
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
    networks:
      - laravel
    ports:
      - "127.0.0.1:5173:5173" # servidor de desarrollo de vite, solo en este equipo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Servicio de Cola (Queue)
  queue:
    image: laravel-12-app
    container_name: laravel-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      - vendor:/var/www/html/vendor
    command: php artisan queue:work --tries=3 --sleep=3
    depends_on:
      - app
      - db
      - redis
    networks:
      - laravel

  # Servicio Web (Nginx)
  nginx:
    image: nginx:1.30-alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80" # Accederás a tu app en http://localhost:8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - .:/var/www/html # Nginx también necesita ver tus archivos públicos
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  # Base de Datos (PostgreSQL)
  db:
    image: postgres:16
    container_name: laravel-postgres
    ports:
      - "127.0.0.1:5432:5432" # Para tu cliente SQL (TablePlus, DBeaver), solo en este equipo
    environment:
      POSTGRES_USER: ${DB_USERNAME:?define DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:?define DB_DATABASE in .env}
    volumes:
      - db-data:/var/lib/postgresql/data # Persistencia de datos aunque borres el contenedor
    networks:
      - laravel

  # Servicio de Caché y Almacenamiento en Memoria (Redis)
  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    restart: unless-stopped
    # Password only if REDIS_PASSWORD is set in your .env.
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "127.0.0.1:6379:6379" # Para RedisInsight, solo en este equipo
    volumes:
      - redis-data:/data
    networks:
      - laravel

  # --- SISTEMA DE OBSERVABILIDAD (LOGS) ---

  # Base de datos para almacenar los logs
  loki:
    image: grafana/loki:3.0.0
    container_name: laravel-loki
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - laravel
    restart: unless-stopped

  # Panel web para buscar y visualizar los logs
  grafana:
    image: grafana/grafana:11.0.0
    container_name: laravel-grafana
    ports:
      - "127.0.0.1:3000:3000" # http://localhost:3000, solo en este equipo
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - laravel
    depends_on:
      - loki
    restart: unless-stopped

  # Recolector automático de logs para Docker
  alloy:
    image: grafana/alloy:v1.1.0
    container_name: laravel-alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint:
      - /bin/sh
      - -euc
      - |
        cat << 'EOF' > /etc/alloy/config.alloy
        loki.write "local" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }

        discovery.docker "containers" {
          host             = "unix:///var/run/docker.sock"
          refresh_interval = "5s"
        }

        discovery.relabel "containers" {
          targets = discovery.docker.containers.targets

          rule {
            source_labels = ["__meta_docker_container_name"]
            regex         = "/(.*)"
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_docker_container_log_stream"]
            target_label  = "stream"
          }
          rule {
            target_label = "job"
            replacement  = "docker"
          }
        }

        loki.source.docker "logs" {
          host             = "unix:///var/run/docker.sock"
          targets          = discovery.relabel.containers.output
          forward_to       = [loki.write.local.receiver]
          refresh_interval = "5s"
        }
        EOF
        exec /bin/alloy run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    networks:
      - laravel
    depends_on:
      - loki
    restart: unless-stopped

networks:
  laravel:
    driver: bridge

volumes:
  db-data:
  redis-data:
  grafana-data:
  loki-data:
  vendor:
  node_modules:
